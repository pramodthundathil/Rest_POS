{% extends 'index.html' %}
{% block content %}

<style>
    .category-add-list {
        width: 80% !important;
        margin: auto;

    }

    @media (max-width:700px) {

        .category-add-list {
            width: 100% !important;

        }
    }
</style>

<div class="category-add-list">

    <div class="content-page">
        <div class="container-fluid add-form-list">
            <div class="row">
                <div class="col-sm-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between">
                            <div class="header-title">
                                <h4 class="card-title">Restaurant Profile</h4>
                                {% for message in messages %}
                            <div class="alert {{message.tags}} " role="alert">
                                <div class="iq-alert-text"><b>Alert</b> {{message}}</div>
                             </div>
                             {% endfor %}
                            </div>
                        </div>
                        <div class="card-body">
                            <form method="post" data-toggle="validator" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="row">
                              
                                    
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            {{form.as_p}}
                                            <div class="help-block with-errors"></div>
                                        </div>
                                    </div>
                                    
                                </div>
                                <button type="submit" class="btn btn-primary mr-2">Add or Update Profile </button>
                                <button type="reset" class="btn btn-danger">Reset</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Page end  -->
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const methodSelect = document.querySelector('select[name="printing_method"]');
        const printerSelect = document.querySelector('select[name="default_printer"]');
        
        if (methodSelect && printerSelect) {
            const printerContainer = printerSelect.closest('p') || printerSelect.closest('.form-group') || printerSelect.parentElement;
            
            function togglePrinterField() {
                if (methodSelect.value === 'SERVER') {
                    printerContainer.style.display = 'block';
                } else {
                    printerContainer.style.display = 'none';
                }
            }
            
            methodSelect.addEventListener('change', togglePrinterField);
            togglePrinterField(); // Initial load run
        }
    });
</script>

{% endblock %}
